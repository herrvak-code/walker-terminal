<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Walker · Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Inter+Tight:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<!--
  WALKER · Terminal. Creado el 30/10/2026 por Claude Code para Jose.
  Todo el contenido llega cifrado (c/*.bin) y se descifra aquí con la
  contraseña (PBKDF2 + AES-GCM, WebCrypto). Lo genera construir_terminal.py.
-->
<style>
:root{
  --papel:#FAF7F1; --papel-2:#F3EEE4; --linea:#E2D9C8; --linea-2:#D7CDBB; --blanco:#FFFFFF;
  --texto:#1B1712; --texto-2:#4A4236; --gris:#6E6557;
  --pizarra:#2E5F73; --pizarra-osc:#1F4252; --pizarra-suave:#E6EEF1; --pizarra-borde:#C9D6DC;
  --tinta:#2E4D73; --ocre:#8E6A2F; --ocre-suave:#F1E5CB;
  --verde-f:#E3EADB; --verde-t:#3B5A2C; --ambar-f:#F1E5CB; --ambar-t:#76561F; --rojo-f:#F0DCD6; --rojo-t:#8A3A2C;
  --serif:'Newsreader', Georgia, serif; --titular:'Fraunces', Georgia, serif; --mano:'Caveat', cursive; --sans:'Inter Tight', system-ui, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--texto);font-family:var(--serif);font-size:17px;line-height:1.55}
a{color:var(--pizarra)} a:hover{color:var(--pizarra-osc)}
button{font:inherit}
[hidden]{display:none !important}
.rotulo{font:600 11px/1.4 var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
.mano{font-family:var(--mano);color:var(--tinta);line-height:1.15}
.subrayado{background:linear-gradient(transparent 58%,rgba(214,170,92,.5) 58%,rgba(214,170,92,.5) 92%,transparent 92%)}
h1{margin:18px 0 0;font:400 clamp(30px,3.6vw,44px)/1.06 var(--titular);letter-spacing:-.01em}
h2{margin:40px 0 10px;font:400 24px/1.2 var(--titular);border-bottom:1.5px solid var(--texto);padding-bottom:8px}
.entradilla{margin:10px 0 0;font-size:18px;color:var(--texto-2);max-width:720px}
.boton{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:6px;border:0;background:var(--pizarra);color:#fff;text-decoration:none;font:600 14px var(--sans);cursor:pointer}
.boton:hover{background:var(--pizarra-osc);color:#fff}
.boton--suave{background:var(--pizarra-suave);color:var(--pizarra-osc);border:1px solid var(--pizarra-borde)}
.boton--suave:hover{background:#D9E5EA;color:var(--pizarra-osc)}
.boton--peq{min-height:36px;padding:0 12px;font-size:12px}
:focus-visible{outline:2px solid var(--ocre);outline-offset:2px}

/* ---------- Entrada ---------- */
#entrada{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--papel-2)}
#entrada form{width:100%;max-width:400px}
#entrada .marca{font:300 64px/1 var(--titular);color:var(--pizarra)}
#entrada label{display:block;margin-top:34px;font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
#entrada input[type=password]{width:100%;margin-top:8px;min-height:48px;padding:0 14px;border:1px solid var(--linea-2);border-radius:6px;background:#fff;font:16px var(--sans)}
#entrada .recordar{display:flex;align-items:center;gap:8px;margin-top:12px;font:14px var(--sans);color:var(--texto-2);letter-spacing:0;text-transform:none}
#entrada .boton{margin-top:20px;width:100%;justify-content:center}
#error{min-height:24px;margin-top:12px;font:14px var(--sans);color:var(--rojo-t)}

/* ---------- Marco ---------- */
.marco{min-height:100vh;display:flex;flex-wrap:wrap}
nav.lateral{flex:1 1 240px;max-width:280px;padding:32px 22px;background:var(--papel-2);border-right:1px solid var(--linea);display:flex;flex-direction:column;gap:22px}
nav .marca{font:300 40px/1 var(--titular);color:var(--pizarra)}
nav .lema{margin-top:8px;font:600 10px/1.5 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--gris)}
nav .grupo{font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gris);padding:16px 12px 6px}
nav a.item{display:flex;flex-direction:column;justify-content:center;min-height:44px;padding:8px 12px;border-radius:6px;text-decoration:none;color:var(--texto)}
nav a.item span{font:400 18px var(--titular)}
nav a.item small{font:12px var(--sans);color:var(--gris)}
nav a.item:hover{background:#EDE6D8}
nav a.item[aria-current=page]{background:var(--pizarra-suave);color:var(--pizarra-osc)}
nav .pie{margin-top:auto;border-top:1px solid var(--linea-2);padding-top:16px}
nav .pie p{margin:0}
nav .salir{margin-top:12px;background:none;border:0;padding:0;font:12px var(--sans);color:var(--gris);text-decoration:underline;cursor:pointer;min-height:32px}
main{flex:999 1 560px;min-width:0;padding:40px clamp(18px,4vw,64px) 64px}
.ancho{max-width:1060px;margin:0 auto}
@media (max-width:720px){
  nav.lateral{max-width:none;border-right:0;border-bottom:1px solid var(--linea);padding:20px 16px;gap:10px}
  nav .menu{display:flex;flex-wrap:wrap;gap:4px} nav .grupo{display:none} nav .pie{display:none}
  nav a.item{min-height:40px;padding:6px 10px} nav a.item small{display:none}
}

/* ---------- Visión ---------- */
.cabecera{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
.capas{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.capa{background:var(--blanco);border:1px solid var(--linea);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px}
.capa .motivo{font-size:14px;line-height:1.4;color:var(--texto-2)}
.estado{align-self:flex-start;padding:3px 10px;border-radius:99px;font:600 13px var(--sans)}
.estado--verde{background:var(--verde-f);color:var(--verde-t)} .estado--ambar{background:var(--ambar-f);color:var(--ambar-t)} .estado--rojo{background:var(--rojo-f);color:var(--rojo-t)} .estado--nada{background:#EEE9E0;color:var(--gris)}
.dos{margin-top:34px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;align-items:start}
.dos h2{margin-top:0}
.caja{background:var(--papel-2);border-top:1.5px solid var(--texto);padding:18px 20px 20px}
.caja p{margin:8px 0 0;font-size:16px}
.lista-semanas a{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:48px;border-bottom:1px solid var(--linea);text-decoration:none;color:var(--texto)}
.lista-semanas a span:last-child{font:12px var(--sans);color:var(--pizarra)}
.lista-semanas{border-top:1px solid var(--linea)}

/* ---------- Tarjetas ---------- */
.pastillas{margin-top:22px;display:flex;flex-wrap:wrap;gap:8px}
.pastillas a{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--pizarra-borde);background:#fff;color:var(--pizarra-osc);text-decoration:none;font:600 13px var(--sans)}
.pastillas a[aria-current=page]{background:var(--pizarra);border-color:var(--pizarra);color:#fff}
.rejilla{margin-top:26px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.tarjeta .foto{padding:14px 14px 0;background:var(--papel-2)}
.pegada{display:block;width:100%;height:150px;object-fit:cover;border:5px solid #fff;background:#E9E2D4;box-shadow:0 3px 8px rgba(0,0,0,.15);transform:rotate(-1deg)}
.tarjeta:nth-child(even) .pegada{transform:rotate(1deg)}
.tarjeta .pie-foto{margin:8px 0 10px;font-size:17px}
.tarjeta .cuerpo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.tarjeta h3{margin:0;font:400 20px var(--titular);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tarjeta h3 small,.ticker{font:600 11px var(--sans);color:var(--gris)}
.tarjeta .desc{margin:0;font-size:15px;line-height:1.4;color:var(--texto-2)}
.titular-tesis{margin:4px 0 0;font:italic 400 16px/1.3 var(--titular);color:var(--pizarra)}
.tarjeta .acciones{margin-top:auto;padding-top:12px;border-top:1px solid #EFE8DB;display:flex;flex-direction:column;gap:10px}
.tarjeta .ultimo{font:12px/1.4 var(--sans);color:var(--texto-2)} .tarjeta .ultimo b{color:var(--gris);font-weight:600}
.botones{display:flex;flex-wrap:wrap;gap:8px}
.etiqueta{align-self:flex-start;display:inline-block;padding:2px 8px;border-radius:99px;background:var(--ocre-suave);color:var(--ambar-t);font:600 11px var(--sans)}
.tambien{margin-top:30px;border-top:1px solid var(--linea);padding-top:14px;font-size:15px;color:var(--texto-2)}

/* Rentabilidad por estrategia y cartera (rediseño del 06/11/2026, opción B elegida por Jose):
   la rentabilidad esperada es lo primero que se lee; los datos no cambian. */
.panel{margin-top:22px;background:var(--blanco);border:1px solid var(--linea);border-radius:10px;box-shadow:0 6px 24px rgba(27,23,18,.07);overflow:hidden}
.panel-cab{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;padding:18px 22px 14px;border-bottom:1px solid var(--linea)}
.panel-cab h2{margin:0;border:0;padding:0;font-size:26px}
.panel-cab .nota-gris{font-size:12px}
.cifra-tir{font:600 26px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em;color:var(--verde-t);white-space:nowrap}
.cifra-tir--negativa{color:var(--rojo-t)}
.cifra-tir--nada{color:var(--linea-2);font-weight:400}
.ranking .fila{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(200px,1.6fr) minmax(250px,1.4fr);gap:8px 22px;align-items:center;padding:16px 22px;border-top:1px solid #EFE8DB}
.ranking .fila:first-of-type{border-top:0}
.ranking .nombre-empresa{font:400 19px var(--titular);color:var(--texto);text-decoration:none}
.ranking a.nombre-empresa:hover{text-decoration:underline}
.ranking small{display:block;font:11px/1.45 var(--sans);color:var(--gris)}
.ranking .medida{display:flex;align-items:center;gap:14px}
.ranking .medida .cifra-tir{min-width:88px}
.pista{position:relative;flex:1;height:10px;background:var(--papel-2);border-radius:5px}
.pista b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--verde-t)}
.pista .vara{position:absolute;top:-6px;bottom:-6px;border-left:1.5px dashed var(--ocre)}
.pista .vara em{position:absolute;top:-17px;left:-14px;font:600 10px var(--sans);font-style:normal;color:var(--ocre);white-space:nowrap}
.ranking .datos{font:13px/1.45 var(--sans);text-align:right;font-variant-numeric:tabular-nums;color:var(--texto-2)}
.ranking .datos strong{font-weight:600;color:var(--texto)}
.rango-52{position:relative;display:inline-block;width:70px;height:4px;margin:0 6px 2px 0;background:var(--linea);border-radius:4px;vertical-align:middle}
.rango-52 span{position:absolute;top:-2px;width:8px;height:8px;border-radius:50%;background:var(--pizarra);transform:translateX(-50%)}
.pendientes{padding:14px 22px;background:var(--papel-2);border-top:1px solid var(--linea);font:13px/1.6 var(--sans);color:var(--texto-2)}
.pendientes a{color:var(--texto)}
.fuente-valoracion{border:0;background:none;padding:0;color:var(--pizarra);font:11px/1.4 var(--sans);text-decoration:underline;cursor:pointer;min-height:28px}
.notas-tabla{margin:10px 0 0;font:12px/1.5 var(--sans);color:var(--gris)}
.notas-tabla p{margin:4px 0}
@media (max-width:720px){
  .panel-cab{padding:16px 16px 12px}
  .ranking .fila{grid-template-columns:1fr;padding:14px 16px}
  .ranking .datos{text-align:left}
  .ranking .medida{margin-top:14px}
  .pendientes{padding:12px 16px}
}
/* Cartera */
.reparto{margin-top:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.reparto a{display:block;padding:18px 20px;border-radius:10px;color:#fff;text-decoration:none}
.reparto a:hover{color:#fff;filter:brightness(1.08)}
.reparto .rotulo{color:rgba(255,255,255,.82)}
.reparto .cifra{display:block;margin-top:6px;font:300 46px/1 var(--titular)}
.reparto small{display:block;margin-top:6px;font:13px var(--sans);color:rgba(255,255,255,.88)}
.posiciones .cab,.posiciones .fila{display:grid;grid-template-columns:minmax(140px,1.3fr) minmax(160px,2fr) 62px 84px 84px 80px;gap:6px 14px;align-items:center;padding:11px 22px;font:13px var(--sans);font-variant-numeric:tabular-nums}
.posiciones .cab{padding-top:9px;padding-bottom:9px;background:var(--papel-2);font:600 11px/1.3 var(--sans);color:var(--gris)}
.posiciones .cab span:nth-child(n+3),.posiciones .num{text-align:right}
.posiciones .fila{border-top:1px solid #EFE8DB}
.posiciones .nombre-empresa{font:400 17px var(--serif);color:var(--texto);text-decoration:none}
.posiciones a.nombre-empresa:hover{text-decoration:underline}
.posiciones small{display:block;font:11px/1.4 var(--sans);color:var(--gris)}
.posiciones .peso{display:flex;align-items:center;gap:10px}
.posiciones .peso i{display:block;height:12px;border-radius:3px;flex:none}
.posiciones .tir{text-align:right;font:600 16px var(--sans);color:var(--verde-t)}
.posiciones .tir--nada{color:var(--linea-2);font-weight:400}
.posiciones .tir--negativa{color:var(--rojo-t)}
.posiciones .peso-estr{color:var(--texto)}
.posiciones .objetivo-movil{display:none}
@media (max-width:720px){
  .posiciones .cab,.posiciones .fila{grid-template-columns:1fr 70px 70px;padding:10px 16px}
  .posiciones .cab span:nth-child(2),.posiciones .cab span:nth-child(4),.posiciones .cab span:nth-child(5){display:none}
  .posiciones .peso{grid-column:1/-1;order:5}
  .posiciones .precio{display:none}
  .posiciones .objetivo-movil{display:block}
  .reparto{grid-template-columns:repeat(3,1fr);gap:8px}
  .reparto a{padding:12px 10px}
  .reparto .rotulo{font-size:9px;letter-spacing:.08em}
  .reparto .cifra{font-size:28px}
  .reparto small{font-size:11px}
}

/* ---------- Empresa ---------- */
.volver{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:600 13px var(--sans);text-decoration:none}
.ficha{margin-top:14px;display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.ficha .foto{flex:0 0 auto;width:280px;max-width:100%}
.ficha .pegada{height:190px;border-width:6px;transform:rotate(-1.5deg)}
.ficha .credito{margin-top:8px;font:10px/1.4 var(--sans);color:var(--gris)}
.ficha .texto{flex:1 1 320px;min-width:0}
.trimestre{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 0;border-bottom:1px solid var(--linea)}
.trimestre .periodo{flex:0 0 150px;font:400 20px var(--titular)}
.trimestre .botones{flex:1 1 300px}
.nota-gris{font:12px var(--sans);color:var(--gris)}

/* ---------- Cartera, método, recursos ---------- */
.tabla-caja{overflow-x:auto}
table{width:100%;min-width:600px;border-collapse:collapse;font:13px var(--sans)}
th{text-align:left;padding:12px 8px 8px;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
td{padding:12px 8px;border-top:1px solid var(--linea)}
.prosa{max-width:760px} .prosa h2{margin-top:36px} .prosa p,.prosa li{font-size:17px}
.prosa blockquote{margin:24px 0;font:italic 300 clamp(24px,2.6vw,32px)/1.25 var(--titular);color:var(--pizarra)}
.aviso-legal{margin-top:56px;padding-top:16px;border-top:1px solid var(--linea);font:12px/1.5 var(--sans);color:var(--gris);max-width:760px}
.vacio{margin-top:26px;font-size:17px;color:var(--texto-2)}

/* ---------- Salida privada (fase 3, 08/11/2026) ---------- */
.sello-privado{display:inline-block;margin-top:10px;padding:3px 10px;border-radius:99px;background:var(--texto);color:var(--papel);font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase}
.opiniones .recuento{margin:8px 0 0;font:13px/1.5 var(--sans);color:var(--gris)}
.opiniones .debate{margin:12px 0 0;max-width:760px;font:italic 400 19px/1.4 var(--titular);color:var(--texto)}
.opiniones .debate--largo{font:400 16px/1.55 var(--serif);color:var(--texto-2)}
.lados{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;align-items:start}
.lado h3{margin:0;padding-bottom:6px;border-bottom:2px solid;font:600 11px var(--sans);letter-spacing:.18em;text-transform:uppercase}
.lado--alcista h3{color:var(--verde-t);border-color:var(--verde-t)}
.lado--bajista h3{color:var(--rojo-t);border-color:var(--rojo-t)}
.argumento{padding:14px 0;border-bottom:1px solid var(--linea)}
.argumento h4{margin:0;font:400 18px/1.3 var(--titular)}
.argumento .tema{display:block;margin-bottom:2px;font:600 10px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gris)}
.argumento p{margin:6px 0 0;font-size:15px;line-height:1.45;color:var(--texto-2)}
.argumento .fuentes{font:12px/1.6 var(--sans);color:var(--gris)}
.chip{display:inline-block;margin-left:4px;padding:1px 7px;border-radius:99px;background:#EEE9E0;color:var(--gris);font:600 10px/1.6 var(--sans);vertical-align:1px}
.chip--pago{background:var(--ocre-suave);color:var(--ambar-t)}
.chip--nuevo{background:var(--pizarra-suave);color:var(--pizarra-osc)}
.discrepo{margin-top:22px;padding:12px 18px;background:#fff;border-left:3px solid var(--tinta);max-width:760px}
.discrepo .mano{font-size:22px}
.vigilancia{margin:8px 0 0;padding-left:20px;font-size:15px;color:var(--texto-2)}
.marco-bib{display:block;width:100%;height:calc(100vh - 190px);min-height:480px;margin-top:18px;border:1px solid var(--linea);border-radius:8px;background:#fff}
.radar-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--linea)}
.radar-item a.titulo{font:400 17px/1.35 var(--serif);color:var(--texto);text-decoration:none}
.radar-item a.titulo:hover{text-decoration:underline}
.radar-item .meta{font:12px/1.5 var(--sans);color:var(--gris)}
.radar-item .tickers{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;align-items:flex-start}
.radar-item .tickers a{font:600 11px var(--sans);text-decoration:none;padding:2px 8px;border:1px solid var(--pizarra-borde);border-radius:99px;background:#fff}
@media (max-width:720px){ .radar-item{grid-template-columns:1fr} .radar-item .tickers{justify-content:flex-start} .marco-bib{height:calc(100vh - 230px)} }

/* ---------- Repaso de tesis (09/11/2026; versión visual del 10/11/2026, a partir de las maquetas de Jose) ---------- */
.rp-hoja{max-width:820px}
.rp-titulo{margin:0;font:400 clamp(30px,3.4vw,40px)/1.1 var(--titular)}
.rp-sub{margin:6px 0 0;font:15px/1.5 var(--sans);color:var(--gris)}
.rp-tarjeta{margin-top:22px;background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:22px 24px}
.rp-sec{margin:26px 0 8px;font:500 13px var(--sans);color:var(--gris)}
.rp-sec:first-child{margin-top:0}
.rp-ag{display:flex;gap:16px;align-items:baseline;padding:11px 0;border-top:1px solid var(--linea);font:15px/1.4 var(--sans)}
.rp-ag .f{flex:0 0 92px;color:var(--gris)}
.rp-ag a{font-weight:600;color:var(--texto);text-decoration:none}
a.rp-emp{display:block;padding:16px 0;border-top:1px solid var(--linea);text-decoration:none;color:var(--texto)}
a.rp-emp:hover .n{text-decoration:underline}
.rp-emp .l{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.rp-emp .n{font:400 21px var(--titular)}

<body>

<div id="entrada">
  <form id="formulario" autocomplete="off">
    <div class="marca">Walker</div>
    <div class="rotulo" style="margin-top:10px">Investigar, decidir y acumular criterio</div>
    <div class="sello-privado" hidden data-privado>Privado</div>
    <label for="clave" id="etiqueta-clave">Contraseña de suscriptor</label>
    <input id="clave" name="clave" type="password" required autocomplete="current-password">
    <label class="recordar"><input id="recordar" type="checkbox" checked> Recordar en este dispositivo</label>
    <button class="boton" type="submit" id="entrar">Entrar</button>
    <div id="error" role="alert"></div>
  </form>
</div>

<div id="app" class="marco" hidden>
  <nav class="lateral" aria-label="Secciones del terminal">
    <div>
      <div class="marca">Walker</div>
      <div class="lema">Investigar, decidir y acumular criterio</div>
      <div class="sello-privado" hidden data-privado>Privado</div>
    </div>
    <div class="menu" id="menu"></div>
    <div class="pie">
      <p class="mano" style="font-size:19px">«¿Es esta una buena inversión a este precio, en este momento y frente a las alternativas?»</p>
      <button class="salir" type="button" id="salir">Salir y olvidar este dispositivo</button>
    </div>
  </nav>
  <main><div class="ancho" id="contenido"></div></main>
</div>

<script>
'use strict';
// Si GitHub Pages o el navegador sirven una versión vieja de esta página,
// version.json (que nunca se guarda en caché) lo delata y se recarga con
// una dirección nueva. El generador pone la huella al publicar.
const VERSION_WEB = '6208fe8e672b';
fetch('version.json', { cache: 'no-store' }).then(r => r.ok ? r.json() : null).then(v => {
  if (v && v.web && v.web !== VERSION_WEB && !location.search.includes(v.web)) {
    location.replace(location.pathname + '?v=' + v.web + location.hash);
  }
}).catch(() => {});

// El generador la pone a true en la salida privada (--salida-privada). Las dos
// webs comparten origen (herrvak-code.github.io): cada una guarda su llave con
// un nombre distinto o se pisan.
const SALIDA_PRIVADA = false;
const ALMACEN = SALIDA_PRIVADA ? 'walker-privado-llave-v1' : 'walker-llave-v1';
if (SALIDA_PRIVADA) {
  document.title = 'Walker · Privado';
  document.querySelectorAll('[data-privado]').forEach(n => { n.hidden = false; });
  document.getElementById('etiqueta-clave').textContent = 'Tu contraseña';
}
let llave = null, llaveB64 = '', datos = null;
const urls = {};

// ---------- cifrado ----------
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const a64 = b => btoa(String.fromCharCode(...new Uint8Array(b)));

async function derivar(clave) {
  const cfg = await (await fetch('clave.json', { cache: 'no-store' })).json();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(clave), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(cfg.sal), iterations: cfg.iteraciones, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function descifrar(buf) {
  const b = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, llave, b.slice(12));
}
async function cargarDatos() {
  const r = await fetch('c/datos.bin', { cache: 'no-store' });
  if (!r.ok) throw new Error('sin datos');
  datos = JSON.parse(new TextDecoder().decode(await descifrar(await r.arrayBuffer())));
}
async function urlDe(id, tipo) {
  if (!urls[id]) {
    const r = await fetch('c/' + id + '.bin');
    let claro = await descifrar(await r.arrayBuffer());
    // Salida privada (08/11/2026): algunos ficheros van comprimidos con gzip (la biblioteca).
    if ((datos.comprimidos || []).includes(id))
      claro = await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    urls[id] = URL.createObjectURL(new Blob([claro], { type: tipo }));
  }
  return urls[id];
}
// El PDF lo descarga y descifra la propia pestaña nueva, que es la que está
// en primer plano: en el móvil, Safari congela la pestaña del terminal en
// cuanto se abre la otra, y si el trabajo se hiciera aquí no terminaría
// hasta volver a ella (el fallo de «al primer clic no abre»).
function abrirPdf(id) {
  const ventana = window.open('', '_blank');
  if (!ventana) { urlDe(id, 'application/pdf').then(u => { location.href = u; }); return; }
  const dato = JSON.stringify({ k: llaveB64, u: new URL('c/' + id + '.bin', location.href).href });
  ventana.document.write(`<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Walker · documento</title><body style="font:16px/1.5 system-ui,sans-serif;padding:2em;color:#1B1712;background:#FAF7F1">
<p id="m">Abriendo el documento…</p><script>
(async () => {
  const m = document.getElementById('m'), d = ${dato.replace(/</g, '\\u003c')};
  try {
    const k = await crypto.subtle.importKey('raw', Uint8Array.from(atob(d.k), c => c.charCodeAt(0)), { name: 'AES-GCM' }, false, ['decrypt']);
    const r = await fetch(d.u);
    if (!r.ok) throw new Error(r.status);
    const b = new Uint8Array(await r.arrayBuffer());
    const url = URL.createObjectURL(new Blob([await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, k, b.slice(12))], { type: 'application/pdf' }));
    // Si el navegador no se deja llevar al PDF, queda un enlace para tocar.
    setTimeout(() => { m.innerHTML = '<a href="' + url + '" style="color:#2E5F73">Abrir el documento</a>'; }, 2500);
    location.replace(url);
  } catch (e) {
    m.textContent = 'No se ha podido abrir el documento. Cierra esta pestaña y vuelve a intentarlo; si sigue sin abrir, sal del terminal y vuelve a entrar.';
  }
})();
<\/script>`);
  ventana.document.close();
}

// ---------- entrada ----------
document.getElementById('formulario').addEventListener('submit', async ev => {
  ev.preventDefault();
  const boton = document.getElementById('entrar'), error = document.getElementById('error');
  boton.disabled = true; boton.textContent = 'Comprobando…'; error.textContent = '';
  try {
    llave = await derivar(document.getElementById('clave').value);
    await cargarDatos();
    llaveB64 = a64(await crypto.subtle.exportKey('raw', llave));
    if (document.getElementById('recordar').checked) {
      try { localStorage.setItem(ALMACEN, llaveB64); } catch (e) {}
    }
    arrancar();
  } catch (e) {
    llave = null; error.textContent = SALIDA_PRIVADA ? 'Contraseña incorrecta. Es la del llavero «walker-cuaderno».'
      : 'Contraseña incorrecta. Está en el último post para suscriptores.';
  } finally { boton.disabled = false; boton.textContent = 'Entrar'; }
});
document.getElementById('salir').addEventListener('click', () => {
  try { localStorage.removeItem(ALMACEN); } catch (e) {}
  location.hash = ''; location.reload();
});
(async () => {
  let guardada = null;
  try { guardada = localStorage.getItem(ALMACEN); } catch (e) {}
  if (!guardada) return;
  try {
    llave = await crypto.subtle.importKey('raw', b64(guardada), { name: 'AES-GCM' }, true, ['decrypt']);
    await cargarDatos(); llaveB64 = guardada; arrancar();
  } catch (e) { llave = null; try { localStorage.removeItem(ALMACEN); } catch (_) {} }
})();

function arrancar() {
  document.getElementById('entrada').hidden = true;
  document.getElementById('app').hidden = false;
  window.addEventListener('hashchange', pintar);
  pintar();
}

// ---------- utilidades ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const SEM = { 'verde': 'verde', 'ámbar': 'ambar', 'ambar': 'ambar', 'rojo': 'rojo' };
const claseEstado = e => 'estado--' + (SEM[String(e || '').toLowerCase()] || 'nada');
function todas() {
  const lista = [];
  datos.estrategias.forEach(e => e.empresas.forEach(x => lista.push({ x, origen: e.titulo, ruta: '#/estrategias/' + e.id })));
  datos.watchlist.forEach(x => lista.push({ x, origen: 'Watchlist', ruta: '#/watchlist' }));
  return lista;
}
function ndocs(x) { return x.tesis.length + (x.complementos || []).length + x.trimestres.reduce((n, t) => n + t.docs.length, 0); }
function ultimo(x) {
  const t = x.trimestres[0];
  if (!t) return 'sin seguimientos todavía';
  return t.periodo + ' · ' + t.docs.map(d => d.tipo.toLowerCase()).join(' y ');
}
function boton(f, texto, clase) {
  return `<button type="button" class="boton ${clase || ''}" data-pdf="${esc(f)}">${esc(texto)}</button>`;
}
function foto(x) {
  if (!x.foto) return '';
  return `<img class="pegada" data-img="${esc(x.foto)}" alt="${esc(x.pie_foto || x.nombre)}">`;
}

// ---------- secciones ----------
const MENU = [
  ['Análisis', [['vision', 'Visión', 'En qué entorno estamos'], ['estrategias', 'Estrategias', 'Dividendos, QGV y Alpha'], ['repaso', 'Repaso', 'Qué ha pasado en cada tesis'], ['watchlist', 'Watchlist', 'Lo que sigo de cerca']]],
  ['Mi cartera', [['cartera', 'Cartera', 'Pesos y movimientos']]],
  ['Recursos', [['metodo', 'Método', 'Cómo trabajo'], ['recursos', 'Lecturas', 'Lo que merece la pena leer']]],
  ['Biblioteca', [['biblioteca', 'Biblioteca', 'Lo que dicen otros'], ['radar', 'Radar', 'Lo entrado esta semana']]]
];

function pintar() {
  const partes = location.hash.replace(/^#\/?/, '').split('/');
  const seccion = partes[0] || 'vision';
  // En la página de una empresa se marca la pestaña de la que viene.
  let marcada = seccion;
  if (seccion === 'empresa') {
    const r = todas().find(o => o.x.id === partes[1]);
    marcada = r && r.origen === 'Watchlist' ? 'watchlist' : 'estrategias';
  }
  if (seccion === 'otros') marcada = 'biblioteca';
  // Sin cartera en los datos (salida pública, 08/11/2026) no se enseña el grupo «Mi cartera».
  // El grupo Biblioteca solo existe con datos.privado (salida privada, 08/11/2026).
  // Repaso (09/11/2026): solo si alguna empresa tiene repaso en esta salida.
  const hay = id => id === 'cartera' ? datos.cartera : (id === 'biblioteca' || id === 'radar') ? datos.privado
    : id === 'repaso' ? conRepaso().length : true;
  const menu = MENU.map(([g, items]) => [g, items.filter(([id]) => hay(id))]).filter(([, items]) => items.length);
  document.getElementById('menu').innerHTML = menu.map(([g, items]) =>
    `<div class="grupo">${esc(g)}</div>` + items.map(([id, t, s]) => {
      const activa = id === marcada;
      return `<a class="item" href="#/${id}"${activa ? ' aria-current="page"' : ''}><span>${esc(t)}</span><small>${esc(s)}</small></a>`;
    }).join('')).join('');
  const vistas = { vision, estrategias, watchlist, empresa, cartera, metodo, recursos, repaso };
  if (datos.privado) Object.assign(vistas, { biblioteca, radar, otros });
  let html;
  try { html = (vistas[seccion] || vision)(partes[1], partes.slice(1)); }
  catch (e) { console.error(e); html = '<h1>Esta sección no se ha podido mostrar</h1><p class="entradilla">Es un fallo del terminal, no de tu conexión. Vuelve a intentarlo más tarde.</p>'; }
  document.getElementById('contenido').innerHTML = html + avisoLegal();
  window.scrollTo(0, 0);
  document.querySelectorAll('[data-pdf]').forEach(b => b.addEventListener('click', () => abrirPdf(b.dataset.pdf)));
  document.querySelectorAll('img[data-img]').forEach(async img => { img.src = await urlDe(img.dataset.img, 'image/jpeg'); });
  const marco = document.querySelector('iframe[data-edicion]');
  if (marco) cargarEdicion(marco);
}

function avisoLegal() {
  return '<p class="aviso-legal">Contenido con fines exclusivamente informativos y de análisis personal. No es asesoramiento financiero ni una recomendación personalizada de compra o venta. Invertir conlleva riesgo de pérdida del capital.</p>';
}

function vision(fecha) {
  const v = (fecha && datos.vision.find(x => x.fecha === fecha)) || datos.vision[0];
  if (!v) return '<div class="rotulo">Visión</div><h1>La primera lectura llega pronto</h1>';
  const capas = (v.capas || []).map(c => `<div class="capa"><span class="rotulo" style="font-size:10px">${esc(c.capa)}</span><span class="estado ${claseEstado(c.estado)}">${esc(c.estado || 'Sin asignar')}</span><span class="motivo">${esc(c.motivo)}</span></div>`).join('');
  const e = v.entorno;
  const entorno = e ? `<div class="caja"><div class="rotulo" style="color:var(--pizarra)">Qué entorno es este</div>
      ${e.favorece ? `<p><strong>Favorece</strong> ${esc(e.favorece)}</p>` : ''}
      ${e.penaliza ? `<p><strong>Penaliza</strong> ${esc(e.penaliza)}</p>` : ''}
      ${e.cambiaria ? `<p><strong>Cambiaría si</strong> ${esc(e.cambiaria)}</p>` : ''}</div>` : '';
  const pdf = v.pdf ? `<div style="margin-top:22px">${boton(v.pdf, 'Descargar el informe completo (PDF)')}</div>` : '<p class="nota-gris" style="margin-top:18px">El informe completo en PDF se publica desde la próxima edición.</p>';
  const otras = datos.vision.filter(x => x !== v);
  const archivo = otras.length ? `<h2>Semanas anteriores</h2><div class="lista-semanas">${otras.map(x => `<a href="#/vision/${esc(x.fecha)}"><span>${esc(x.semana || '')} · ${esc(x.fecha.split('-').reverse().join('/'))} · ${esc(x.titular)}</span><span>${x.pdf ? 'Informe (PDF)' : 'Resumen'}</span></a>`).join('')}</div>` : '';
  return `<div class="cabecera rotulo"><span>Visión · lectura macro semanal</span><span>${esc(v.semana || '')} · corte al ${esc(v.fecha.split('-').reverse().join('/'))}</span></div>
    <h1>${esc(v.titular)}</h1>
    ${v.frase ? `<p class="mano" style="margin:14px 0 0;font-size:24px">${esc(v.frase)}</p>` : ''}
    <div class="capas">${capas}</div>
    <div class="dos"><div><h2>La lectura</h2><p style="margin:0">${esc(v.lectura)}</p>${pdf}</div>${entorno}</div>
    ${archivo}`;
}

function tarjeta(x, conEtiqueta) {
  return `<article class="tarjeta">
    ${x.foto ? `<div class="foto">${foto(x)}<p class="pie-foto mano">${esc(x.pie_foto)}</p></div>` : ''}
    <div class="cuerpo">
      ${conEtiqueta ? `<span class="etiqueta">${esc(x.etiqueta)}</span>` : ''}
      <h3>${esc(x.nombre)} <small>${esc(x.ticker)}</small></h3>
      <p class="desc">${esc(x.descripcion)}</p>
      ${x.titular ? `<p class="titular-tesis">«${esc(x.titular)}»</p>` : ''}
      <div class="acciones">
        <div class="ultimo"><b>Último trimestre · </b>${esc(ultimo(x))}</div>
        <div class="botones">${boton(x.tesis[0].f, 'Tesis · ' + x.tesis[0].fecha, 'boton--peq')}
          <a class="boton boton--suave boton--peq" href="#/empresa/${esc(x.id)}">Todos los documentos (${ndocs(x)})</a></div>
      </div>
    </div></article>`;
}

function estrategias(id) {
  const e = datos.estrategias.find(x => x.id === id) || datos.estrategias[0];
  const pastillas = datos.estrategias.map(x => `<a href="#/estrategias/${x.id}"${x === e ? ' aria-current="page"' : ''}>${esc(x.titulo)}</a>`).join('');
  const rejilla = e.empresas.length ? `<div class="rejilla">${e.empresas.map(x => tarjeta(x, false)).join('')}</div>`
    : '<p class="vacio">Todavía no hay ninguna tesis publicada en esta estrategia.</p>';
  return `<div class="rotulo">Estrategias · empresas en cartera</div><h1>${esc(e.titulo)}</h1><p class="entradilla">${esc(e.vara)}</p>
    <div class="pastillas" role="navigation" aria-label="Estrategia">${pastillas}</div>${tablaEstrategia(e)}
    <h2>Tesis disponibles</h2>${rejilla}
    ${e.tambien ? `<p class="tambien"><span class="rotulo" style="font-size:10px">También en cartera, con su tesis en camino · </span>${esc(e.tambien)}</p>` : ''}`;
}

function fechaMercado(valor) {
  if (!valor) return 'Sin fecha';
  if (/^\d{2}\/\d{2}\/\d{4}$/.test(valor)) return valor;
  const d = new Date(valor);
  return Number.isNaN(d.getTime()) ? 'Sin fecha' : d.toLocaleDateString('es-ES', { timeZone: 'Europe/Madrid' });
}
// Rediseño del 06/11/2026 (opción B): ranking por rentabilidad, de mayor a menor,
// con una barra por empresa y la marca del 15 %. Mismos datos que la tabla anterior.
const claseTir = r => r == null ? 'cifra-tir cifra-tir--nada' : 'cifra-tir' + (r < 0 ? ' cifra-tir--negativa' : '');
function fuenteValoracion(v) {
  return v ? `<button type="button" class="fuente-valoracion" data-pdf="${esc(v.documento)}">${v.tipo === 'seguimiento' ? 'Seguimiento' : 'Tesis'} ${fechaMercado(v.fecha)} · p. ${esc(v.pagina)}</button>` : '';
}
// Texto neutro a propósito: un plazo o un calendario en revisión no se describe
// al suscriptor (Jose, 06/11/2026). Solo se distingue si hay o no valoración.
function motivoPendiente(x) {
  return x.valoracion ? 'en revisión' : 'sin valoración publicada';
}
// Horizonte de la rentabilidad (redacción de la sesión del calendario de la TIR, 06/11/2026):
// Quality vende al publicarse las cuentas de 2030. En las demás se deduce de horizonte_anos:
// «a cinco años» solo si todas las valoraciones con rentabilidad tienen cinco años.
const HORIZONTE = { qgv: ['hasta la publicación de las cuentas de 2030', 'hasta 2031'] };
function horizonte(id) {
  if (HORIZONTE[id]) return HORIZONTE[id];
  const e = datos.estrategias.find(x => x.id === id);
  const todas5 = (e && e.tabla || []).filter(x => x.retorno != null).every(x => x.valoracion.horizonte_anos === 5);
  return todas5 ? ['a cinco años', '5 años'] : ['hasta la venta de cada modelo', 'hasta la venta'];
}
const horizonteLargo = id => horizonte(id)[0];
const horizonteCorto = id => horizonte(id)[1];
function pesoEnEstrategia(e, ticker) {
  const c = datos.cartera && datos.cartera.estrategias.find(x => x.estrategia === e.titulo);
  const p = c && ticker && c.empresas.find(x => x.ticker === ticker);
  return p ? p.peso : null;
}
function tablaEstrategia(e) {
  const filas = [...(e.tabla || [])];
  if (!filas.length) return '<p class="vacio">Todavía no hay datos de seguimiento para esta estrategia.</p>';
  const con = filas.filter(x => x.retorno != null).sort((a, b) => b.retorno - a.retorno);
  const sin = filas.filter(x => x.retorno == null);
  const nombres = new Set(e.empresas.map(x => x.ticker));
  const enlace = x => nombres.has(x.ticker) ? `<a class="nombre-empresa" href="#/empresa/${encodeURIComponent(x.ticker)}">${esc(x.empresa)}</a>`
    : x.bib && datos.privado ? `<a class="nombre-empresa" href="#/otros/${encodeURIComponent(x.bib)}">${esc(x.empresa)}</a>`
    : `<span class="nombre-empresa">${esc(x.empresa)}</span>`;
  // Escala de las barras: de 0 a 20 %, o hasta la mayor rentabilidad si la supera.
  const tope = Math.max(0.20, ...con.map(x => x.retorno));
  const cuerpo = con.map(x => {
    const v = x.valoracion, peso = pesoEnEstrategia(e, x.ticker);
    const rango = x.min_52 != null && x.max_52 != null && x.max_52 > x.min_52;
    const punto = rango ? Math.max(0, Math.min(100, (x.precio-x.min_52)/(x.max_52-x.min_52)*100)) : 0;
    const ancho = Math.max(0, Math.min(100, x.retorno / tope * 100));
    return `<div class="fila"><div>${enlace(x)}<small>${esc(x.ticker)}${x.sector ? ' · ' + esc(x.sector) : ''}${peso != null ? ' · ' + pct(peso) + ' de la estrategia' : ''}</small></div>
      <div class="medida"><span class="${claseTir(x.retorno)}">${pct(x.retorno)}</span><div class="pista" role="img" aria-label="Rentabilidad ${pct(x.retorno)} frente al 15 %"><b style="width:${ancho}%"></b><span class="vara" style="left:${0.15 / tope * 100}%"><em>15 %</em></span></div></div>
      <div class="datos">Hoy <strong>${precio(x.precio)}</strong> → objetivo <strong>${precio(v.objetivo)}</strong> ${esc(x.moneda)}
        <small>Precio para el 15 % anual: ${precio(x.precio_15)} · ${esc(v.metodo)}${v.fecha_objetivo ? ' · ' + esc(v.fecha_objetivo) : ''}</small>
        ${rango ? `<small><span class="rango-52" role="img" aria-label="Precio entre mínimo ${precio(x.min_52)} y máximo ${precio(x.max_52)} de 52 semanas"><span style="left:${punto}%"></span></span>52 sem. ${precio(x.min_52)} – ${precio(x.max_52)}</small>` : ''}
        <small>Precio a ${fechaMercado(x.fecha_precio)}${!x.actualizado ? ' (dato guardado)' : ''} · resultados por confirmar</small>
        ${fuenteValoracion(v)}</div></div>`;
  }).join('');
  const pendientes = sin.length ? `<div class="pendientes"><strong>Sin rentabilidad todavía</strong> · ${sin.map(x => {
    return `${enlace(x).replace('nombre-empresa', '')} <span class="nota-gris">(${esc(motivoPendiente(x))})</span>`;
  }).join(' · ')}</div>` : '';
  return `<div class="panel ranking"><div class="panel-cab"><h2>Rentabilidad esperada</h2><span class="nota-gris">TIR total anual ${esc(horizonteLargo(e.id))} · de mayor a menor · la línea marca el 15 %</span></div>
    ${cuerpo}${pendientes}</div>
    <div class="notas-tabla"><p>Rentabilidad total: TIR con los dividendos por acción y el precio de venta del caso central del maestro. Precio para el 15 %: precio al que la TIR del caso central, con los mismos dividendos y la misma venta, sería del 15 %.</p>
    <p>Caso central de la última valoración publicada, incluida una revisión posterior en un seguimiento. Cada objetivo enlaza a su documento de origen. Las empresas sin valoración publicada o con la valoración en revisión aparecen en «Sin rentabilidad todavía».</p></div>`;
}

function watchlist() {
  const rejilla = datos.watchlist.length ? `<div class="rejilla">${datos.watchlist.map(x => tarjeta(x, true)).join('')}</div>`
    : '<p class="vacio">Todavía no hay ninguna tesis publicada en la watchlist.</p>';
  return `<div class="rotulo">Watchlist · empresas que sigo sin tenerlas</div><h1>Lo que espera su precio</h1>
    <p class="entradilla">Cada empresa lleva la etiqueta de la cartera en la que entraría.</p>${rejilla}
    ${datos.watchlist_tambien ? `<p class="tambien"><span class="rotulo" style="font-size:10px">También en seguimiento · </span>${esc(datos.watchlist_tambien)}</p>` : ''}`;
}

function empresa(id) {
  const r = todas().find(o => o.x.id === id);
  if (!r) return '<h1>No encuentro esa empresa</h1>';
  const x = r.x;
  const trimestres = x.trimestres.length ? x.trimestres.map(t => `<div class="trimestre"><div class="periodo">${esc(t.periodo)}</div>

    : '<p class="vacio">La primera ficha previa saldrá unos días antes de los próximos resultados.</p>';
  const complementos = (x.complementos || []).map(d => `<div class="trimestre"><div class="periodo">${esc(d.fecha)}</div>
      <div class="botones"><div>${boton(d.f, d.titulo + ' (PDF)', 'boton--suave')}
        ${d.descripcion ? `<p class="nota-gris" style="margin:8px 0 0">${esc(d.descripcion)}</p>` : ''}</div></div></div>`).join('');

  return `<a class="volver" href="${r.ruta}">← Volver a ${esc(r.origen)}</a>
    <div class="ficha">
      ${x.foto ? `<div class="foto">${foto(x)}<p class="mano" style="margin:10px 0 0;font-size:18px">${esc(x.pie_foto)}</p><p class="credito">${esc(x.credito)}</p></div>` : ''}
      <div class="texto"><span class="etiqueta">${esc(x.etiqueta)}</span>
        <h1 style="margin-top:10px">${esc(x.nombre)} <span class="ticker" style="font-size:14px">${esc(x.ticker)}</span></h1>
        <p class="entradilla" style="margin-top:6px">${esc(x.descripcion)}</p>
        ${x.titular ? `<p class="titular-tesis" style="font-size:21px;margin-top:12px">«${esc(x.titular)}»${x.subtitular ? ' ' + esc(x.subtitular) : ''}</p>` : ''}
        <div class="botones" style="margin-top:18px">${boton(x.tesis[0].f, 'Tesis vigente · ' + x.tesis[0].fecha + ' (PDF)')}
          ${x.repaso ? `<a class="boton boton--suave" href="#/repaso/${encodeURIComponent(x.id)}">Repaso de la tesis</a>` : ''}</div></div>
    </div>
    ${x.discrepo ? `<div class="discrepo"><div class="mano">Dónde discrepo</div><div class="prosa">${x.discrepo}</div></div>` : ''}
    ${datos.privado ? panelOpiniones(x.bib, false) : ''}
    ${complementos ? `<h2>Lecturas complementarias</h2>${complementos}` : ''}
    <h2>Trimestre a trimestre</h2>
    <p class="nota-gris" style="margin:0 0 4px">El más reciente arriba. La ficha previa fija antes del dato qué confirma la tesis y qué la pone en alerta; el seguimiento lo contrasta.</p>
    ${trimestres}
    ${anteriores.length ? `<h2>Tesis anteriores</h2><div class="botones">${anteriores.map(t => boton(t.f, 'Tesis · ' + t.fecha, 'boton--suave')).join('')}</div>` : ''}`;
}

const pct = (v, d = 1) => (v === null || v === undefined || v === '') ? '—' : (v * 100).toLocaleString('es-ES', { minimumFractionDigits: d, maximumFractionDigits: d }) + ' %';
const precio = v => (v === null || v === undefined || v === '') ? '—' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const COLOR_ESTR = ['#2E5F73', '#8E6A2F', '#2E4D73', '#A89B84'];
const TIPO = { 'Cierre': 'estado--rojo', 'Cierre excision': 'estado--rojo', 'Reducción': 'estado--ambar', 'Compra': 'estado--verde', 'Ampliación': 'estado--verde' };

const COLOR_POR_ESTR = { 'Dividendos': '#2E5F73', 'Quality · Growth · Value': '#8E6A2F', 'Alpha': '#2E4D73' };
const colorEstr = (nombre, i) => COLOR_POR_ESTR[nombre] || COLOR_ESTR[i % 4];
function cartera() {
  const c = datos.cartera;
  if (!c) return '<div class="rotulo">Cartera · pesos y movimientos</div><h1>En preparación</h1><p class="entradilla">Aquí irán los pesos por estrategia y por empresa, y los movimientos. Sin importes, número de acciones ni precio medio.</p>';
  const idDe = nombre => (datos.estrategias.find(x => x.titulo === nombre) || {}).id;
  const fichas = new Set(datos.estrategias.flatMap(e => e.empresas.map(x => x.ticker)));
  const reparto = c.reparto.map((r, i) => {
    const id = idDe(r.estrategia);
    const dentro = `<span class="rotulo">${esc(r.estrategia)}</span><span class="cifra">${pct(r.peso)}</span><small>${esc(r.n)} ${r.estrategia === 'Tendencial' ? 'activos' : 'empresas'}${id ? ' · ver la estrategia →' : ''}</small>`;
    return id ? `<a href="#/estrategias/${id}" style="background:${colorEstr(r.estrategia, i)}">${dentro}</a>` : `<a style="background:${colorEstr(r.estrategia, i)}">${dentro}</a>`;
  }).join('');
  const bloques = c.estrategias.map((e, i) => {
    const color = colorEstr(e.estrategia, i);
    const r = c.reparto.find(x => x.estrategia === e.estrategia);
    const max = Math.max(...e.empresas.map(x => x.peso || 0)) || 1;
    const filas = e.empresas.map(x => {
      const nombre = x.nombre || x.empresa;
      const n = x.ticker && fichas.has(x.ticker) ? `<a class="nombre-empresa" href="#/empresa/${encodeURIComponent(x.ticker)}">${esc(nombre)}</a>` : `<span class="nombre-empresa">${esc(nombre)}</span>`;
      return `<div class="fila"><div>${n}<small>${esc(x.sector)} · ${esc(x.mercado)}</small><small class="objetivo-movil">Precio ${precio(x.precio)} · objetivo ${precio(x.objetivo)}</small></div>
        <div class="peso"><i style="width:${(x.peso || 0) / max * 80}%;background:${color}"></i><strong class="peso-estr">${pct(x.peso)}</strong></div>
        <div class="num">${pct(x.peso_total)}</div><div class="num precio">${precio(x.precio)}</div><div class="num precio">${precio(x.objetivo)}</div>
        <div class="tir${x.retorno == null ? ' tir--nada' : x.retorno < 0 ? ' tir--negativa' : ''}">${pct(x.retorno)}</div></div>`;
    }).join('');
    return `<div class="panel posiciones"><div class="panel-cab" style="border-left:6px solid ${color}"><h2>${esc(e.estrategia)}</h2><span style="font:300 32px var(--titular);color:${color}">${r ? pct(r.peso) : ''} <span class="nota-gris">del total · ${e.empresas.length} empresas</span></span></div>
      <div class="cab"><span>Empresa</span><span>Peso en la estrategia</span><span>Peso total</span><span>Precio</span><span>${esc(e.horizonte)}</span><span>Rentabilidad total anual · ${esc(horizonteCorto(idDe(e.estrategia)))}</span></div>${filas}</div>`;
  }).join('');
  const movs = c.movimientos.length ? `<h2>Movimientos</h2><div class="tabla-caja"><table><thead><tr><th>Fecha</th><th>Empresa</th><th>Cartera</th><th>Tipo</th></tr></thead>
      <tbody>${c.movimientos.map(m => `<tr><td>${esc(m.fecha)}</td><td style="font:15px var(--serif)">${esc(m.empresa)}</td><td>${esc(m.cartera)}</td><td><span class="estado ${TIPO[m.tipo] || 'estado--nada'}">${esc(m.tipo)}</span></td></tr>`).join('')}</tbody></table></div>`
    : '<h2>Movimientos</h2><p class="vacio" style="margin-top:0">Los movimientos se publican a partir de enero de 2027.</p>';
  return `<div class="rotulo">Cartera · pesos y movimientos</div><h1>Cómo está repartida</h1>
    <p class="entradilla">Solo pesos, sin importes, sobre el total de Dividendos, Quality · Growth · Value y Alpha.</p>
    <div class="reparto">${reparto}</div>
    ${bloques}
    <p class="nota-gris" style="margin-top:14px">Posiciones a ${esc(c.posiciones_a)}. Pesos calculados a ${esc(c.precios_a)}. Los precios y sus fechas individuales se detallan en Estrategias. Objetivos del caso central de la última valoración publicada; rentabilidad total anual con los dividendos previstos por el modelo hasta la fecha de venta de cada valoración, que se detalla en Estrategias. «—» indica valoración pendiente o en revisión.${c.cambios_congelados ? ' Tipos de cambio guardados: ' + esc(c.cambios_congelados) + '.' : ''}</p>
    ${movs}`;
}

// ---------- salida privada: biblioteca, radar y opiniones (fase 3, 08/11/2026) ----------
const isoDmy = f => f.slice(8, 10) + '/' + f.slice(5, 7) + '/' + f.slice(0, 4);
const fechaBib = f => !f ? 'sin fecha' : f.length === 10 ? isoDmy(f) : f.length === 7 ? f.slice(5) + '/' + f.slice(0, 4) : f;
const enlaceExterno = (url, texto, clase) => /^https?:\/\//.test(url || '')
  ? `<a${clase ? ` class="${clase}"` : ''} href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(texto)}</a>` : esc(texto);
function fuenteBib(f) {

function argumento(a) {

// Panel «Qué dicen otros»: en la ficha, tres argumentos por lado; en su página, todos.
function panelOpiniones(clave, completo) {
  const b = clave && datos.privado.empresas[clave];
  if (!b) return completo ? '' : '<h2>Qué dicen otros</h2><p class="vacio">La biblioteca todavía no tiene análisis de esta empresa.</p>';

  const lado = (l, titulo) => {
    const xs = b.argumentos.filter(a => a.lado === l);
    return `<div class="lado lado--${l}"><h3>${titulo} · ${xs.length}</h3>${xs.slice(0, max).map(argumento).join('') || '<p class="vacio">Ninguno recogido.</p>'}
      ${xs.length > max ? `<p class="nota-gris">y ${xs.length - max} más</p>` : ''}</div>`;
  };
  return `<section class="opiniones"><h2>Qué dicen otros</h2>
    <p class="recuento">${r.alcistas} alcistas · ${r.bajistas} bajistas · ${r.documentos} documentos · último ${fechaBib(r.ultima)}${b.fecha_revision ? ' · revisado ' + fechaBib(b.fecha_revision) : ''}</p>
    ${b.debate ? `<p class="debate${b.debate.length > 280 ? ' debate--largo' : ''}">${esc(b.debate)}</p>` : ''}

    <div class="botones" style="margin-top:18px">${completo ? '' : `<a class="boton boton--suave" href="#/otros/${encodeURIComponent(clave)}">Ver todos los argumentos</a>`}
      <a class="boton boton--suave" href="#/biblioteca/empresa/${encodeURIComponent(b.empresa_id)}">Abrir en la Biblioteca</a></div></section>`;
}
function otros(clave) {
  const b = datos.privado.empresas[clave];
  if (!b) return '<h1>Esa empresa no está en la biblioteca</h1>';
  const ficha = todas().find(o => o.x.bib === clave);

    ${panelOpiniones(clave, true)}`;
}
function radar() {
  const p = datos.privado, items = p.radar;
  const fichas = new Map(todas().map(o => [o.x.bib, o.x.id]));
  const chip = t => {
    const ruta = fichas.has(t) ? '#/empresa/' + encodeURIComponent(fichas.get(t)) : p.empresas[t] ? '#/otros/' + encodeURIComponent(t) : null;
    return ruta ? `<a href="${ruta}">${esc(t)}</a>` : `<span class="chip">${esc(t)}</span>`;

      <div class="tickers">${x.tickers.map(chip).join('')}</div></div>`).join('')}`).join('');
  return `<div class="rotulo">Biblioteca · radar</div><h1>Lo entrado esta semana</h1>
    <p class="entradilla">${items.length} textos desde el ${esc(isoDmy(p.radar_desde))} sobre empresas que la biblioteca sigue. Sin vídeos ni resultados de búsqueda sin leer.${p.radar_recortado ? ` Se han quedado fuera ${p.radar_recortado} por el tope.` : ''}</p>
    ${cuerpo || '<p class="vacio">Nada nuevo esta semana.</p>'}`;
}
function biblioteca(_, resto) {
  const ruta = (resto || []).join('/');

}
// La edición se descarga solo al abrir esta pestaña. Va en un iframe del mismo
// origen (blob:) para que conserve las preferencias que guarda en este navegador.
async function cargarEdicion(marco) {
  const estado = document.getElementById('estado-bib');
  try {
    const url = await urlDe(datos.privado.edicion.f, 'text/html');
    marco.src = url + (marco.dataset.ruta ? '#/' + marco.dataset.ruta : '');
    marco.hidden = false; estado.hidden = true;
  } catch (e) {
    console.error(e);
    estado.textContent = 'No se ha podido abrir la biblioteca. Vuelve a intentarlo; si sigue, sal y vuelve a entrar.';
  }
}

// ---------- Repaso de tesis (09/11/2026; versión visual del 10/11/2026) ----------
// Una vista de la tesis vigente y sus seguimientos posteriores (contrato en
// _terminal/REPASO.md). El precio, la rentabilidad de hoy y el precio para el
// 15 % salen de la misma fila que la tabla de Estrategias: nunca se contradicen.
// Jose (10/11/2026): sin contador ni variables descartadas, y un solo visto
// bueno por ficha («validada»): lo da al confirmar las variables que le propongo.
const RP_ESTADO = { intacta: 'Intacta', bajo_presion: 'Bajo presión', en_vigilancia: 'En vigilancia' };
const RP_VEREDICTO = { confirma: 'Confirma', debilita: 'Debilita', no_toca: 'No toca' };
const RP_CORTO = { div: 'Dividendos', qgv: 'QGV', alpha: 'Alpha' };
const pp = v => (v === null || v === undefined) ? '—' : Number(v).toLocaleString('es-ES', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + ' %';
function conRepaso() { return todas().filter(o => o.x.repaso); }
function filaTabla(ticker) {
  for (const e of datos.estrategias) { const f = (e.tabla || []).find(x => x.ticker === ticker); if (f) return f; }
  return null;
}
function estrategiaDe(x) {
  const e = datos.estrategias.find(e => e.empresas.includes(x));
  return e ? RP_CORTO[e.id] : 'Watchlist';
}
const rpCuenta = (r, valor) => r.variables.filter(v => v.estado && v.estado.valor === valor).length;
// Orden de la portada: proporción de variables bajo presión y, a igualdad, en vigilancia.
const rpPresion = r => (rpCuenta(r, 'bajo_presion') + rpCuenta(r, 'en_vigilancia') / 10) / r.variables.length;
function rpEstado(est) {
  if (!est) return '<span class="rp-est nada">Sin estado</span>';
  return `<span class="rp-est ${esc(est.valor)}">${esc(RP_ESTADO[est.valor] || est.valor)}</span>`;
}
function repaso(id) { return id ? repasoEmpresa(id) : repasoPortada(); }

function repasoPortada() {
  const lista = conRepaso().map(o => o.x).sort((a, b) => rpPresion(b.repaso) - rpPresion(a.repaso) || a.nombre.localeCompare(b.nombre));
  const nvar = lista.reduce((n, x) => n + x.repaso.variables.length, 0);
  const npres = lista.reduce((n, x) => n + rpCuenta(x.repaso, 'bajo_presion'), 0);
  const hace60 = new Date(Date.now() - 60 * 864e5).toISOString().slice(0, 10);
  const nhechos = lista.reduce((n, x) => n + (x.repaso.linea_tiempo || []).filter(h => h.fecha >= hace60).length, 0);
  // Solo el próximo hecho de cada empresa; el resto, en su ficha.
  const porFecha = (a, b) => String(a.fecha).localeCompare(String(b.fecha));
  const agenda = lista.map(x => ({ h: [...(x.repaso.proximos_hechos || [])].sort(porFecha)[0], x }))
    .filter(o => o.h).map(o => ({ ...o.h, x: o.x })).sort(porFecha);
  const filas = lista.map(x => {
    const r = x.repaso, t = filaTabla(x.ticker), b = rpCuenta(r, 'bajo_presion'), v = rpCuenta(r, 'en_vigilancia');
    const meta = [t && t.retorno != null ? pct(t.retorno) : null, b ? b + ' bajo presión' : 'sin presión', v ? v + ' en vigilancia' : null, r.desactualizado ? 'desactualizado' : null].filter(Boolean).join(' · ');
    const barras = r.variables.map(v => `<i class="${v.estado ? esc(v.estado.valor) : ''}" title="${esc(v.nombre)}"></i>`).join('');
    return `<a class="rp-emp" href="#/repaso/${encodeURIComponent(x.id)}"><div class="l"><span><span class="n">${esc(x.nombre)}</span> <span class="m">· ${esc(meta)}</span></span><span class="flecha" aria-hidden="true">›</span></div>
      <div class="rp-salud">${barras}</div></a>`;
  }).join('');
  return `<div class="rp-hoja"><div class="rp-tarjeta">
    <h1 class="rp-titulo">Repaso de tesis</h1>
    <p class="rp-sub">${lista.length} tesis · ${npres} de ${nvar} variables bajo presión · ${nhechos} ${nhechos === 1 ? 'hecho' : 'hechos'} en 60 días</p>
    ${agenda.length ? `<div class="rp-sec">Próximos hechos</div>${agenda.map(h => `<div class="rp-ag"><span class="f">${esc(h.etiqueta)}</span>
      <span><a href="#/repaso/${encodeURIComponent(h.x.id)}">${esc(h.x.ticker)}</a> · ${esc(h.hecho)}</span></div>`).join('')}` : ''}
    <div class="rp-sec" style="margin-top:30px">Por empresa</div>${filas}
    <p class="rp-pista">Toca una empresa para abrir su ficha.</p></div></div>`;
}

function repasoEmpresa(id) {
  const o = conRepaso().find(o => o.x.id === id);
  if (!o) return '<h1>Esa empresa no tiene repaso</h1><p class="entradilla"><a href="#/repaso">Volver al repaso</a></p>';
  const x = o.x, r = x.repaso, t = filaTabla(x.ticker), tn = r.tesis_negocio || {}, ti = r.tesis_inversion || {};
  const nombreVar = vid => (r.variables.find(v => v.id === vid) || {}).nombre || vid;
  const variables = r.variables.map(v => `<details class="rp-var"><summary><span>${esc(v.nombre)}${v.termino ? `<small class="rp-term">(${esc(v.termino)})</small>` : ''}</span>${rpEstado(v.estado)}</summary>
    <div class="det">${v.pregunta ? `<p><strong>${esc(v.pregunta)}</strong></p>` : ''}<p>${esc(v.por_que)}</p>
      ${v.ultimo_dato ? `<p><strong>Último dato.</strong> ${esc(v.ultimo_dato)}</p>` : ''}
      ${(v.indicadores || []).length ? `<div class="tabla-caja"><table><thead><tr><th>Qué mirar</th><th>Cuándo</th><th>Peor</th><th>Mejor</th></tr></thead>
        <tbody>${v.indicadores.map(i => `<tr><td>${esc(i.que)}${i.termino ? `<small class="rp-term">(${esc(i.termino)})</small>` : ''}</td><td>${esc(i.cuando)}</td><td>${esc(i.conservador)}</td><td>${esc(i.favorable)}</td></tr>`).join('')}</tbody></table></div>` : ''}
      ${v.rompe ? `<div class="rp-rompe"><strong>Lo que la rompería.</strong> ${esc(v.rompe)}</div>` : ''}</div></details>`).join('');
  const proximo = (r.proximos_hechos || [])[0];
  const hechos = (r.linea_tiempo || []).map(h => `<div class="rp-hecho"><div class="t">${esc(isoDmy(h.fecha))} · ${esc(h.hecho)}</div>
      ${h.efectos.map(e => `<div class="rp-efecto ${esc(e.veredicto)}">${esc(RP_VEREDICTO[e.veredicto])} · ${esc(nombreVar(e.variable))}: ${esc(e.lineas)}</div>`).join('')}</div>`).join('');
  const tiempo = `<details class="rp-tiempo"><summary>${proximo ? 'Próximo hecho: ' + esc(proximo.hecho) + ', ' + esc(proximo.etiqueta.toLowerCase()) + ' · ' : ''}<b>ver línea de tiempo ›</b></summary>
    ${(r.proximos_hechos || []).length > 1 ? `<div class="rp-sec" style="margin-top:12px">Próximos hechos</div>${r.proximos_hechos.map(h => `<div class="rp-ag"><span class="f">${esc(h.etiqueta)}</span><span>${esc(h.hecho)}</span></div>`).join('')}` : ''}
    <div class="rp-sec" style="margin-top:16px">Lo que ha pasado</div>${hechos || '<p class="rp-nota" style="margin-top:0">Nada registrado todavía después de la tesis.</p>'}</details>`;
  const d = r.direccion || {};
  const ejes = (d.ejes || []).map(e => `<div class="rp-eje" title="${esc(e.eje + '. ' + e.texto)}"><i class="${esc(e.estado)}"></i><span>${esc(e.corto || e.texto)}</span></div>`).join('');
  // Hasta dos promesas a la vista; si hay más, se dice cuántas quedan (Jose, 10/11/2026: «(y 1 más)» no se entendía).
  const ps = d.promesas_abiertas || [];
  const promesas = ps.slice(0, 2).map(p => `<p class="rp-promesa">Promesa abierta: ${esc(p.promesa)} · ${esc(p.se_resuelve)}</p>`).join('')
    + (ps.length > 2 ? `<p class="rp-promesa">Y ${ps.length - 2} promesa${ps.length - 2 > 1 ? 's' : ''} más en la tesis.</p>` : '');
  // Quién pone dinero (Jose, 10/11/2026): insiders siempre, con el neto por año en barras;
  // grandes gestores solo si pasan los filtros de REPASO.md. Contexto, nunca evidencia.
  const ci = d.compras_insiders, gs = d.gestores || [];
  let insiders = '';
  if (ci && (ci.por_ano || []).length) {
    const max = Math.max(...ci.por_ano.map(a => Math.abs(a.neto))) || 1;
    const ult = ci.por_ano[ci.por_ano.length - 1].ano;
    const n = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toLocaleString('es-ES');
    insiders = `<div class="rp-ins"><div class="tit">${esc(ci.titulo || 'Compras de insiders')}</div><p class="res">${esc(ci.resumen)}</p>
      <div class="rp-barras" role="img" aria-label="Compras menos ventas de insiders por año">${ci.por_ano.map(a => `<div class="${a.ano === ult ? 'ultimo' : ''}${a.neto < 0 ? ' neg' : ''}"><em>${n(a.neto)}</em><b style="height:${Math.max(2, Math.abs(a.neto) / max * 70)}px"></b>${a.ano}</div>`).join('')}</div>
      <p class="rp-nota" style="margin-top:6px">Compras menos ventas declaradas, en ${esc(ci.unidad || 'millones')}.${ci.ultima ? ' Última: ' + esc(ci.ultima) : ''}</p>
      <details><summary>ver detalle ›</summary><div class="tabla-caja"><table><thead><tr><th>Año</th><th>Compras</th><th>Ventas</th><th>Neto</th>${ci.por_ano.some(a => a.en_bolsa != null) ? '<th>En bolsa</th>' : ''}</tr></thead>
        <tbody>${ci.por_ano.map(a => `<tr><td>${a.ano}</td><td>${a.compras.toLocaleString('es-ES')}</td><td>${a.ventas.toLocaleString('es-ES')}</td><td>${n(a.neto)}</td>${a.en_bolsa != null ? `<td>${a.en_bolsa}</td>` : ''}</tr>`).join('')}</tbody></table></div>
        ${ci.precedente ? `<p class="rp-nota">${esc(ci.precedente)}</p>` : ''}${ci.cautela ? `<p class="rp-nota">${esc(ci.cautela)}</p>` : ''}${ci.fuente ? `<p class="rp-nota">Fuente: ${esc(ci.fuente)}</p>` : ''}</details></div>`;
  }
  const gestores = gs.map(g => `<div class="rp-ins"><div class="tit">${esc(g.nombre)}</div><p class="res">${esc(g.que)}</p>
      <p class="rp-nota">Dato a ${esc(isoDmy(g.fecha_dato))}. ${esc(g.retraso || '')}${g.fuente ? ' Fuente: ' + esc(g.fuente) + '.' : ''}</p></div>`).join('');
  const dinero = insiders || gestores ? `<div class="rp-sec" style="margin-top:18px">Quién pone dinero</div>${insiders}${gestores}` : '';
  // Valoración viva: el precio de hoy frente al de la tesis y al precio para el 15 %.
  let viva = '<p class="rp-nota">Sin rentabilidad publicada para el precio de hoy.</p>';
  if (t && t.precio != null) {
    // La vara de cada estrategia: Dividendos pide un 8 % mínimo y un 10 % objetivo; las demás, un 15 %.
    const div = datos.estrategias.some(e => e.id === 'div' && e.empresas.includes(x));
    const varas = div ? [[t.precio_8, '8 %'], [t.precio_10, '10 %']] : [[t.precio_15, '15 %']];
    const marcas = [...varas, [ti.precio_tesis, 'tesis']].filter(([v]) => v != null);
    const vals = [t.precio, ...marcas.map(([v]) => v)], lo = Math.min(...vals) * 0.9, hi = Math.max(...vals) * 1.08;
    const pos = v => ((v - lo) / (hi - lo) * 100).toFixed(1);
    viva = `<div class="rp-viva"><div class="rp-fila2"><span>Precio de hoy</span><strong>${precio(t.precio)} ${esc(t.moneda || '')}</strong></div>
      <div class="rp-escala" role="img" aria-label="Precio de hoy frente al de la tesis y al precio para el 15 %"><div class="barra"></div>
        ${marcas.map(([v, et]) => `<div class="m" style="left:${pos(v)}%">${et}<small><br>${precio(v)}</small></div>`).join('')}
        <div class="hoy" style="left:${pos(t.precio)}%"></div></div>
      <div class="rp-fila2"><span>Caso central a ese precio</span><strong>${pct(t.retorno)}</strong></div>
      <p class="rp-nota">${div ? `El central da un 8 % por debajo de ${precio(t.precio_8)} ${esc(t.moneda || '')} y un 10 % por debajo de ${precio(t.precio_10)} ${esc(t.moneda || '')}.` : `Por debajo de ${precio(t.precio_15)} ${esc(t.moneda || '')} el central daría un 15 %.`} Precio a ${esc(fechaMercado(t.fecha_precio))}${!t.actualizado ? ' (dato guardado)' : ''}.</p></div>`;
  }
  return `<a class="volver" href="#/repaso">← Repaso</a>
    <div class="rp-hoja"><div class="rp-tarjeta">
    <div class="rp-cab"><h1 class="rp-titulo">${esc(x.nombre)} · ${esc(x.ticker)} · ${esc(estrategiaDe(x))}</h1><span class="fecha">Tesis ${esc(isoDmy(r.tesis.fecha))}</span></div>
    ${!r.validada ? '<p class="rp-nota" style="margin-top:12px">Pendiente de tu visto bueno.</p>' : ''}
    ${r.desactualizado ? '<div class="rp-rompe" style="margin-top:14px">Este repaso no recoge todavía el último seguimiento publicado.</div>' : ''}
    <div class="rp-sec">1 · Las dos tesis</div>
    <div class="rp-dos"><div class="rp-caja"><div class="et">Negocio</div><div class="v ${tn.estado ? esc(tn.estado.valor) : ''}">${tn.estado ? esc(RP_ESTADO[tn.estado.valor]) : '—'}</div><div class="d">${esc(tn.datos || '')}</div></div>
      <div class="rp-caja"><div class="et">Inversión</div><div class="v">${pp(ti.central)} central</div><div class="d">Rango ${pp((ti.rango || [])[0])} a ${pp((ti.rango || [])[1])}</div></div></div>
    <div class="rp-sec">2 · Variables críticas</div>${variables}${tiempo}
    ${ejes || promesas || dinero ? `<div class="rp-sec">3 · Dirección${d.quien ? ' · ' + esc(d.quien) : ''}</div>${ejes}${promesas}${dinero}` : ''}
    <div class="rp-sec">4 · Valoración viva</div>${viva}
    </div>
    <div class="botones" style="margin-top:16px">${boton(x.tesis[0].f, 'Tesis vigente (PDF)', 'boton--suave boton--peq')}
      <a class="boton boton--suave boton--peq" href="#/empresa/${encodeURIComponent(x.id)}">Todos los documentos</a></div></div>`;
}

function recursos() {
  if (!datos.lecturas.length) return '<div class="rotulo">Lecturas</div><h1>Lecturas de la semana</h1><p class="entradilla">Una selección semanal de lo que merece la pena leer, con una línea de por qué. Empieza pronto.</p>';
  return `<div class="rotulo">Lecturas</div><h1>Lecturas de la semana</h1>${datos.lecturas.map(l => `<div class="prosa"><h2>${esc(l.fecha)}</h2>${l.html}${l.pdf ? `<div style="margin-top:22px">${boton(l.pdf, 'Descargar la lectura (PDF)')}</div>` : ''}</div>`).join('')}`;
}
</script>
